name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
  # 每 6 小时自动重新构建一次，刷新下载页的发布快照
  schedule:
    - cron: '0 */6 * * *'
  # 可以在 Actions 页面手动运行
  workflow_dispatch:
  # AIDE-Plus 发布新版本后可通过 repository_dispatch(type: release) 立即触发
  repository_dispatch:
    types: [release]

# 部署到 GitHub Pages 需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置 Node.js 20 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # 安装依赖项
      - name: Install dependencies
        run: npm ci

      # 读取 Pages 配置，得到部署子路径（项目页为 /仓库名，自定义域名为空）
      - name: Setup Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      # 拉取发布快照 -> 类型检查 + vite build -> 生成子页面入口
      - name: Build project
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # PR 只检查能否构建，上传产物方便预览
      - name: Upload artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

      # 上传 Pages 产物（PR 不部署）
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 发布到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
